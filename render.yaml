# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in the Render dashboard choose
# "New > Blueprint" and point it at this repo. Render provisions the free
# Postgres database and the free web service (which serves both the API and
# the built React frontend from one origin - see Dockerfile.render) and
# wires the generated secrets together automatically.

databases:
  - name: password-leak-detector-db
    plan: free
    databaseName: password_leak_detector
    user: app

services:
  - type: web
    name: password-leak-detector
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: password-leak-detector-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AES_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: ACCESS_TOKEN_EXPIRY_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRY_DAYS
        value: "7"

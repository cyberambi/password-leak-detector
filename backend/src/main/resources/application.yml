server:
  port: 8080

spring:
  application:
    name: password-leak-detector
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/password_leak_detector}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  security:
    jwt-secret: ${JWT_SECRET}
    access-token-expiry-minutes: ${ACCESS_TOKEN_EXPIRY_MINUTES:15}
    refresh-token-expiry-days: ${REFRESH_TOKEN_EXPIRY_DAYS:7}
    aes-key: ${AES_KEY}
    # Cookie "Secure" flag - MUST be true when served over HTTPS. Left overridable
    # because this project's docker-compose serves plain HTTP on localhost (no TLS
    # termination is in scope), and browsers silently drop Secure cookies over HTTP.
    cookie-secure: ${COOKIE_SECURE:true}
  hibp:
    base-url: ${HIBP_BASE_URL:https://api.pwnedpasswords.com/range/}
    connect-timeout-ms: ${HIBP_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${HIBP_READ_TIMEOUT_MS:5000}

spring:
  datasource:
    url: jdbc:h2:mem:testdb-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql

app:
  security:
    jwt-secret: test-only-secret-please-do-not-use-in-prod-32b
    aes-key: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
    cookie-secure: false
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7
